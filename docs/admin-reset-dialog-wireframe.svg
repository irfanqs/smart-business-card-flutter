<svg xmlns="http://www.w3.org/2000/svg" width="620" height="400" viewBox="0 0 620 400" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe dialog sandi sementara admin</title>
  <desc id="desc">Dialog setelah admin mereset sandi, menampilkan sandi sementara sekali, tombol salin, dan petunjuk memberikannya kepada pemilik akun.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #202020; }
    .small { font-size: 14px; }
    .body { font-size: 16px; }
    .muted { fill: #666; }
  </style>
  <rect width="620" height="400" fill="#e8e8e8"/>
  <rect x="45" y="42" width="530" height="316" rx="10" fill="#fff" stroke="#d4d4d4"/>
  <text x="74" y="88" font-size="22" font-weight="700">Sandi sementara dibuat</text>
  <text x="74" y="121" class="small muted">Akun: andi@example.com</text>
  <text x="74" y="158" class="small">Salin sandi ini sekarang. Sandi hanya tampil sekali.</text>
  <rect x="74" y="178" width="472" height="54" rx="6" fill="#f5f5f5" stroke="#d5d5d5"/>
  <text x="92" y="212" class="body" font-weight="700">K7m9-L3q2-P8r4</text>
  <rect x="451" y="188" width="83" height="34" rx="5" fill="#202020"/>
  <text x="475" y="210" class="small" style="fill:#fff">Salin</text>
  <text x="74" y="262" class="small muted">Berikan kepada pemilik akun di luar aplikasi.</text>
  <text x="74" y="284" class="small muted">Pengguna wajib menggantinya setelah masuk.</text>
  <rect x="432" y="304" width="114" height="36" rx="5" fill="#202020"/>
  <text x="463" y="327" class="small" style="fill:#fff">Selesai</text>
</svg>
